# Config — NBA fantasy-archetype project (see docs/PROJECT_PLAN.md).
# Single source of truth: seasons, eras, sources. No magic numbers in code.

experiment:
  sport: basketball
  name: nba_archetypes_v1

data:
  source: sportsdataverse           # base layer (hoopR data releases); + nba_api + Fantrax later
  # Season = season-ENDING year (2014 = the 2013-14 season). Floor = 2013-14 SportVU era (§2.2).
  earliest_season: 2014
  latest_completed_season: 2025     # 2024-25 (2025-26 not yet started)
  raw_dir: data/raw
  cache_format: parquet

# Rotation-player filter for the clustering population (archetypes = role, not deep-bench noise).
# Provisional — tune in EDA.
eligibility:
  min_minutes_pg: 15.0
  min_games: 20

# Style eras (PROJECT_PLAN §2.2; ending-year). Provisional — reevaluate if archetypes are weak.
# Phase 1 (define archetypes) uses E2+E3; Phases 2/3 use all (E1+E2+E3).
eras:
  - name: E1                        # 2013-14 .. 2016-17 — SportVU begins; pace-and-space ramp
    start_season: 2014
    end_season: 2017
    use_for_archetypes: false
  - name: E2                        # 2017-18 .. 2019-20 — 3-pt explosion; switch defense
    start_season: 2018
    end_season: 2020
    use_for_archetypes: true
  - name: E3                        # 2020-21 .. present — post-bubble modern
    start_season: 2021
    end_season: null
    use_for_archetypes: true

# Phase-2 fantasy target: two PUBLIC Fantrax sample leagues (9-cat). No auth needed.
fantasy:
  platform: fantrax
  format: 9cat
  cache_dir: .cache               # max_pf box-score cache (gitignored); warm across retries
  league_ids:
    - blk3bn3clw9njuhc
    - wserh14rmbbpqtcg

# Phase 1 — archetype discovery (soft GMM on the *_z style features; fit on E2+E3 eligible,
# assigned to all eligible 2013+). k chosen via BIC plateau + the ~11-14 / "13 positions" target;
# style space is continuous (low silhouette) so soft membership is the point. Names are PROVISIONAL
# (tied to seed=1729, k=12) — formalized in the soft->hard consolidation after EDA.
archetypes:
  k: 12
  k_range: [8, 16]
  covariance_type: full
  n_init: 5
  # PCA-whiten before the GMM: the style features are collinear (3-pt-ness, usage), which makes a
  # raw full-cov GMM overconfident (median top_prob ~1.0). Whitening to ~90% variance (8 PCs) gives
  # genuinely SOFT membership (~47% of players are blends) AND raises YoY stability 0.55 -> 0.61.
  pca_variance: 0.90
  names:                            # by GMM component index (seed=1729, PCA-whitened); see reports/REPORT_archetypes.md
    0: Foul-Drawing Iso Scorer
    1: Lead Playmaker
    2: Scoring Combo Guard
    3: Connector Wing
    4: Volume Wing Scorer
    5: Two-Way Forward
    6: 3-and-D Wing
    7: Balanced Wing
    8: Interior Big
    9: High-Usage Primary
    10: Rebounding Big-Forward
    11: Rim-Running Center

reproducibility:
  random_seed: 1729
  results_dir: reports/results
  figures_dir: reports/figures
