# Config — NBA fantasy-archetype project (see docs/PROJECT_PLAN.md).
# Single source of truth: seasons, eras, sources. No magic numbers in code.

experiment:
  sport: basketball
  name: nba_archetypes_v1

data:
  source: sportsdataverse           # base layer (hoopR data releases); + nba_api + Fantrax later
  # Season = season-ENDING year (2014 = the 2013-14 season). Floor = 2013-14 SportVU era (§2.2).
  earliest_season: 2014
  latest_completed_season: 2026     # 2025-26 complete as of mid-2026 (needed for the 2026 league)
  raw_dir: data/raw
  cache_format: parquet

# Rotation-player filter for the clustering population (archetypes = role, not deep-bench noise).
# Provisional — tune in EDA.
eligibility:
  min_minutes_pg: 15.0
  min_games: 20

# Style eras (PROJECT_PLAN §2.2; ending-year). Provisional — reevaluate if archetypes are weak.
# Phase 1 (define archetypes) uses E2+E3; Phases 2/3 use all (E1+E2+E3).
eras:
  - name: E1                        # 2013-14 .. 2016-17 — SportVU begins; pace-and-space ramp
    start_season: 2014
    end_season: 2017
    use_for_archetypes: false
  - name: E2                        # 2017-18 .. 2019-20 — 3-pt explosion; switch defense
    start_season: 2018
    end_season: 2020
    use_for_archetypes: true
  - name: E3                        # 2020-21 .. present — post-bubble modern
    start_season: 2021
    end_season: null
    use_for_archetypes: true

# Phase-2 fantasy target: two PUBLIC Fantrax sample leagues (9-cat). No auth needed.
fantasy:
  platform: fantrax
  format: 9cat
  cache_dir: .cache               # max_pf box-score cache (gitignored); warm across retries
  league_ids:
    - blk3bn3clw9njuhc            # season 2025 (2024-25)
    - wserh14rmbbpqtcg            # season 2026 (2025-26)
  # Residual Fantrax->ESPN name mismatches that survive accent/punct normalization (nicknames).
  # Found via the `make compose` unmatched diagnostic; accents are handled in _norm, not here.
  name_aliases:
    Nicolas Claxton: Nic Claxton
    Cameron Thomas: Cam Thomas
    Carlton Carrington: Bub Carrington

# Phase-2 AUGMENTATION: the user's personal Yahoo NBA redraft history — more real 9-cat
# team-config -> success examples than the 2 Fantrax leagues. Only the "H2H Cat One" seasons of the
# long-running league (EXACTLY the same 9 cats) are listed; the 2014/2016 "H2H Points" seasons,
# the pre-2014 middle-school leagues (outside the archetype window), the 4-team side league, and the
# user's NFL leagues are excluded. NOTE: Yahoo labels seasons by START year (league season 2023 =
# 2023-24); our archetype membership is keyed by END year (2024), so the join adds +1.
# Config = roster "configuration" as a season-long average (membership weighted by weeks-rostered);
# success label = category-win rate over the regular season. See data/yahoo.py.
fantasy_yahoo:
  platform: yahoo
  format: 9cat
  token_file: ~/activity/notebooks/woj_tokens.json   # yahoo_oauth OAuth2 (auto-refreshes in place)
  cache_dir: .cache/yahoo                             # per-league weekly-roster + matchup cache (gitignored)
  league_keys:
    - "353.l.37110"     # 2015-16 (Lenins)
    - "375.l.10560"     # 2017-18 (Hoxha)
    - "385.l.5726"      # 2018-19 (Colangelo)
    - "395.l.12682"     # 2019-20 (Trumps)
    - "402.l.8048"      # 2020-21 (Guillem)
    - "410.l.11456"     # 2021-22 (Maduro)
    - "418.l.9715"      # 2022-23 (Faligula)
    - "428.l.5686"      # 2023-24 (Sauron)

# Phase 1 — archetype discovery (soft GMM on the *_z style features; fit on E2+E3 eligible,
# assigned to all eligible 2013+). k chosen via BIC plateau + the ~11-14 / "13 positions" target;
# style space is continuous (low silhouette) so soft membership is the point. Names are PROVISIONAL
# (tied to seed=1729, k=12) — formalized in the soft->hard consolidation after EDA.
features:
  # fg3_pct is z-scored only for players with a reliable 3-pt sample; below this season-3PA floor it is
  # neutralized (NaN -> 0 z) so small-sample percentages don't distort archetypes. See features/build.py.
  min_3pa_for_fg3_pct: 30

archetypes:
  k: 13                             # 13 separates the ball-dominant scorers (engines) from low-usage
                                    # distributors that k=12 merged; see REPORT_archetypes.md
  k_range: [8, 16]
  covariance_type: full
  n_init: 5
  # PCA-whiten before the GMM: the style features are collinear (3-pt-ness, usage), which makes a
  # raw full-cov GMM overconfident (median top_prob ~1.0). Whitening to ~90% variance (8 PCs) gives
  # genuinely SOFT membership (~47% of players are blends) AND raises YoY stability 0.55 -> 0.61.
  pca_variance: 0.90
  names:                            # by GMM component index (seed=1729, PCA-whitened, fg3-gated k=13, 2014-2026); see reports/REPORT_archetypes.md
    0: Rim-Running Center            # DeAndre Jordan, Gobert, R. Williams — FG%/OREB+, no 3s
    1: Lead Scoring Guard            # Trae, Ja, Lillard, Booker, Harden — high-volume scoring guards
    2: Stretch Forward               # Horford, Dean Wade, Kessler Edwards — floor-spacing forwards/bigs
    3: Low-Usage Wing                # Pete Nance, Ryan Dunn, Johnny Davis — replacement-level role wings
    4: Foul-Drawing Iso Scorer       # Butler, Zion, DeRozan — FTA/mid-range, low 3s
    5: High-Usage Engine             # Jokic, SGA, Giannis, Luka, Embiid — elite ball-dominant hubs
    6: Perimeter Stopper             # Covington, Thybulle, Okogie — steals, low usage (off-ball D)
    7: Movement Shooter              # Kennard, Kispert, Hardaway — high 3PA rate + efficiency, low TOV
    8: Rebounding Forward            # Robinson-Earl, Jalen Smith, PJ Tucker — OREB+, low playmaking
    9: Lead Playmaker                # Tyus Jones, Haliburton, McConnell — efficient AST:TO floor generals
    10: Non-Scoring Playmaker        # Ben Simmons, Payton, Draymond — on-ball distributors, no scoring
    11: Wing Shot-Creator            # Mitchell, Paul George, Edwards, Kawhi — perimeter shot creation
    12: Rim-Protecting Big           # Turner, JJJ, Wembanyama, Chet, Porzingis — DREB/BLK+, some stretch

reproducibility:
  random_seed: 1729
  results_dir: reports/results
  figures_dir: reports/figures
