[project]
name = "position-predictor"
version = "0.1.0"
description = "Predict next-season fantasy rank for pro sports players, per sport and per position."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Rohan V" }]

dependencies = [
    # data source
    "nfl-data-py>=0.3.2",
    "requests>=2.32",      # Sleeper fantasy-eligibility API pull
    # data wrangling
    "pandas>=2.2",
    "numpy>=1.26",
    "pyarrow>=15.0",       # parquet caching
    # modeling
    "scikit-learn>=1.5",
    "lightgbm>=4.3",
    "xgboost>=2.1",
    # stats / eval
    "scipy>=1.13",
    "statsmodels>=0.14",
    # config & viz
    "pyyaml>=6.0",
    "matplotlib>=3.9",
    "seaborn>=0.13",
]

[project.optional-dependencies]
notebooks = [
    "jupyterlab>=4.2",
    "ipykernel>=6.29",
    "shap>=0.45",          # feature-importance analysis
]
dev = [
    "pytest>=8.2",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sports/football/src/position_predictor"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
# Per-sport projects live under sports/<sport>/; list each sport's tests here.
testpaths = ["sports/football/tests"]
