[project]
name = "position-predictor"
version = "0.1.0"
description = "Predict next-season fantasy rank for pro sports players, per sport and per position."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Rohan V" }]

dependencies = [
    # data source — nflreadpy is nflverse's maintained loader (supersedes the deprecated
    # nfl-data-py, which is frozen at the 2024 player_stats release). Returns polars frames.
    "nflreadpy>=0.1.5",
    "requests>=2.32",      # Sleeper fantasy-eligibility API pull
    # data wrangling
    "pandas>=2.2",
    "numpy>=1.26",
    "pyarrow>=15.0",       # parquet caching
    # modeling
    "scikit-learn>=1.5",
    "lightgbm>=4.3",
    "xgboost>=2.1",
    # stats / eval
    "scipy>=1.13",
    "statsmodels>=0.14",
    # config & viz
    "pyyaml>=6.0",
    "matplotlib>=3.9",
    "seaborn>=0.13",
    # --- basketball (sports/basketball) data sources ---
    "sportsdataverse>=0.0.36",  # base: hoopR/sportsdataverse NBA loaders (box/advanced)
    "nba_api>=1.4",             # granular: stats.nba.com play-type / tracking / shot zones
    "fantraxapi>=0.2",          # Phase-2 fantasy team configs from the two public Fantrax leagues
    "max-pf",                   # Phase-2 optimal-lineup ("max points-for") season estimates
    "yahoo_fantasy_api>=2.12",  # Phase-2 augmentation: personal Yahoo 9-cat redraft history
    "yahoo-oauth>=2.1",         # OAuth2 for the Yahoo Fantasy API (token at ~/activity/notebooks)
]

[project.optional-dependencies]
notebooks = [
    "jupyterlab>=4.2",
    "ipykernel>=6.29",
    "shap>=0.45",          # feature-importance analysis
]

# Test/lint tooling lives in a PEP 735 dependency-group (not optional-dependencies)
# so a plain `uv sync` installs it — otherwise `uv run pytest` falls through to any
# globally-installed pytest, which won't see this project's deps (e.g. pandas).
[dependency-groups]
dev = [
    "pytest>=8.2",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "sports/football/src/position_predictor",
    "sports/football/src/medstaff",
    "sports/basketball/src/nba_archetypes",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint.per-file-ignores]
# Notebooks bootstrap sys.path before importing position_predictor, so the package
# imports legitimately come after a statement — E402 doesn't apply here.
"*.ipynb" = ["E402"]

[tool.pytest.ini_options]
# Per-sport projects live under sports/<sport>/; list each sport's tests here.
testpaths = ["sports/football/tests", "sports/basketball/tests"]
